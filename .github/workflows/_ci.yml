name: CI Pipeline

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with ty
        run: uv run ty check

  coverage-gate:
    name: Coverage Gate (≥50%)
    runs-on: ubuntu-latest
    needs: [quality-checks]
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run unit tests (collect coverage)
        run: |
          uv run pytest tests/unit/ tests/test_settings.py \
            tests/test_process.py tests/test_errors.py \
            --cov=src/samstack --cov-report= \
            --cov-branch -v

      - name: Run integration tests (append coverage)
        run: |
          uv run pytest tests/ -v --timeout=300 \
            --ignore=tests/unit \
            --ignore=tests/test_settings.py \
            --ignore=tests/test_process.py \
            --ignore=tests/test_errors.py \
            --ignore=tests/warm \
            --ignore=tests/integration/test_warm_crash.py \
            --cov=src/samstack --cov-append --cov-report= \
            --cov-branch

      - name: Run warm integration tests (append coverage)
        run: |
          uv run pytest tests/warm/ -v --timeout=300 \
            --cov=src/samstack --cov-append --cov-report= \
            --cov-branch

      - name: Enforce coverage gate
        run: coverage report --fail-under=50


