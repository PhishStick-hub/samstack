name: Publish to PyPI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g., v0.1.0)'
        required: true
        type: string

jobs:
   publish:
    name: Build and Publish to Production PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    environment:
      name: pypi
      url: https://pypi.org/project/samstack/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha }}

      - name: Wait for release tag (workflow_run only)
        if: github.event_name == 'workflow_run'
        run: |
          for i in $(seq 1 12); do
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -n "$TAG" ]; then
              echo "Found release tag: $TAG"
              exit 0
            fi
            echo "No release tag yet ($i/12)..."
            sleep 10
          done
          echo "No release tag after 2 min — skipping publish"
          echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"

      - name: Download built package (workflow_run)
        if: github.event_name == 'workflow_run' && env.SKIP_PUBLISH != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build package (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: uv build

      - name: Publish to PyPI
        if: env.SKIP_PUBLISH != 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
